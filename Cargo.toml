[package]
name = "as2mca-mock"
version = "0.1.0"
edition = "2024"
authors = ["Falldot <fe.offep@gmail.com>"]
readme = "README.md"
description = "Aplication Server 2MCA API HTTP Mock Server"
license = "MIT"
build = "src/infrastructure/config/build.rs"
homepage = "https://github.com/plp-lang/as2mca-mock"
repository = "https://github.com/plp-lang/as2mca-mock"
categories = [
  "development-tools::testing",
  "web-programming::http-server"
]
keywords = [
  "testing",
  "mock",
  "2mca",
  "cbs",
  "cft"
]

[lints.rust]

[lints.clippy]
complexity = { level = "deny", priority = -1 }
suspicious =  { level = "deny", priority = -1 }
correctness =  { level = "deny", priority = -1 }

perf =  { level = "warn", priority = -1 }
cargo =  { level = "warn", priority = -1 }
style =  { level = "warn", priority = -1 }
nursery =  { level = "warn", priority = -1 }
pedantic =  { level = "warn", priority = -1 }

multiple_crate_versions = "allow"

[dependencies]
thiserror = "2.0.19"
base64 = "0.23.0"
hex = "0.4.3"
clap = { version = "4.6.4", features = ["derive", "env"] }
serde = { version = "1.0.229" }
log = { version = "0.4.33", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
fake = { version = "5.1.0", features = ["derive"] }
axum = "0.8.9"
cookie = "0.18.1"
chrono = { version = "0.4.45", features = ["serde"] }
shadow-rs = "2.0.0"
as2mca-api = "0.2.0"
moka = { version = "0.12.15", features = ["future"] }
sha2 = "0.11.0"
redb = "4.1.0"
reqwest = "0.13.4"

[build-dependencies]
shadow-rs = "2.0.0"
